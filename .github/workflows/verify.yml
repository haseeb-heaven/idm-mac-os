name: macOS verification
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.runner }} verification
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Extension and browser harness checks
        run: python3 -u scripts/ci_checks.py extensions
      - name: Core download and Keychain checks
        run: python3 -u scripts/ci_checks.py core
      - name: Build release package
        run: python3 -u scripts/ci_checks.py package
      - name: Native UI smoke and end-to-end checks
        run: python3 -u scripts/ci_checks.py ui
      - name: Native browser host acceptance
        run: python3 -u scripts/ci_checks.py native
      - name: Verify packaged signatures and record build proof
        run: python3 -u scripts/ci_checks.py proof
      - name: Archive tested app and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macdownloadmanager-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/MDM-tested.zip
            build/ci-proof.json
            build/ui-smoke.json
            build/ui-e2e.json
            build/ui-e2e.png
            build/native-browser-report.json
          if-no-files-found: warn
          retention-days: 14
